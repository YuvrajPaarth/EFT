<html>
    <head>
        <title>
            DOM - Document Object Model
        </title>
        <style></style>
    </head>
    <body>
        <form>
            <h1>Google</h1>
            <label>Username:</label>
            <input type="text" placeholder="username" id="v1" name="uid"><br><br>
            <label>Password:</label>
            <input type="password" placeholder="password" id="v2" name="pwd"><br><br>
            <button type="button" onclick="Login()">Login</button>
            <button>Reset</button>
            <p id="result">Result:</p>
        </form>

        <p id="Name">Hello Yuvi</p>
        <button onclick="btn()">Change</button>
        <script>
            function btn(){
                document.getElementById("Name").innerHTML = "I am the Best"
            };


            function Login(){
                let uid = document.getElementById("v1").value;
                let pwd = document.getElementById("v2").value;

                if(uid == "Yuvraj" && pwd == "12345"){
                    document.getElementById("result").innerHTML = "Successful!!!";
                    result.style.color = "Green";
                }else{
                    document.getElementById("result").innerHTML = "Failed!!";
                    result.style.color = "Red";
                }
            }

        </script>
    </body>
</html>
