<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Of the Triangle</title>
    <script>
        var a = prompt('Please enter the 1st value: ');
        var b = prompt('Please enter the 2nd value: ');
        
        var area = (a * b)/2;
        document.write(area);
    </script>
</head>
<body>
    <h1>Area Of the Triangle</h1>
</body>
</html>
