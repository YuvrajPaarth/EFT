<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum</title>
</head>
<body>
    <script>
        let a = prompt("Enter the 1st number: ","")
        let b = prompt("Enter the 2nd number: ","")

        var c = parseInt(a) + parseInt(b)
        document.write(c)
    </script>
    
</body>
</html>
