Normal Function
--Local scope
<html>
    <head>
        <title>Java script</title>
        
    </head>
    <body>
        <h1 >Java Script</h1>
        <script>
            function Sum(){
                let a = 10; 
                let b = 20;
                document.writeln("Sum of the number: " + (a+b));
            }
            Sum();

        </script>
    </body>
</html>

Normal Function
--Global scope
<html>
    <head>
        <title>Java script</title>
        
    </head>
    <body>
        <h1 >Java Script</h1>
        <script>
            let a = 10; 
            let b = 20;
            function Sum(){
                
                document.writeln("Sum of the number: " + (a+b));
            }
            Sum(a,b);

        </script>
    </body>
</html>

Parameter func
<html>
    <head>
        <title>Java script</title>
    </head>
    <body>
        <h1 >Java Script</h1>
        <script>
            function Sum(a, b){
                document.write("Sum of the numbers "+ (a + b))
            }
            Sum(20,40);
        </script>
    </body>
</html>

Parameter with argument func
<html>
    <head>
        <title>Java script</title>
    </head>
    <body>
        <h1 >Java Script</h1>
        <script>
            function Sum(a=10, b=20){
                document.write("Sum of the numbers "+ (a + b))
            }
            Sum(a,b);
        </script>
    </body>
</html>

Arrow func
<html>
    <head>
        <title>Java script</title>
    </head>
    <body>
        <h1 >Java Script</h1>
        <script>
            let add = (a=80,b=20) => {document.write("Sum of the numbers: " + (a+b))};
            add();
            let sub = (c=20,d=40) => {document.write("Subtract of the number:" + (c-d))};
            sub();
        </script>
    </body>
</html>
