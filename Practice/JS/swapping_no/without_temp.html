<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Without_temp</title>
    <script>
        let a = parseInt(prompt("Enter the first number"))
        let b = parseInt(prompt("Enter the second number"))
        alert(`The first number is ${a} and the second number is ${b}`)

        a = a + b; //a = 4, b = 2 => a = 6, b = 2
        b = a - b; //a = 6, b = 2 => b = 4, a = 6
        a = a - b;
        alert(`The first number is ${a} and the second number is ${b}`)
        
    </script>
</head>

</body>
</html>
