<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Flipper</title>
    <style>

        #red{
            background-color: red;
        }

        #green{
            background-color: green;
        }
        
        #blue{
            background-color: blue;
        }

        button{
            border-radius: 5px;
            width: 100px;
            height: 50px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h3>Color Flipper</h3>
    <button id="red" onclick="bodyColor('red')">Red</button>
    <button id="green" onclick="bodyColor('green')">Green</button>
    <button id="blue" onclick="bodyColor('blue')">Blue</button>
    <button onclick="randomColor()">Random</button>
    <script src="index.js"></script>
</body>
</html>
