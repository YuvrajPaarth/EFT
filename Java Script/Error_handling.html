<html>
    <head>
        <title>Error Handling</title>
    </head>
    <body>
        <h1>Error Handling</h1>
        <script>
            try{
                let sum = 10+1;
                document.write(sum);
            }catch(error){
                document.write("Error solved!")
            }
            finally{
                document.write("program over!")
            }

        </script>
    </body>
</html>
